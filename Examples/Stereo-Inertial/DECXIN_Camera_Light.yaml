%YAML:1.0

#--------------------------------------------------------------------------------------------
# Camera Parameters. Adjust them!
#--------------------------------------------------------------------------------------------
File.version: "1.0"

# 2026-11-09 实测标定：德创信 2720x960 双目模组，棋盘 11x8 / 方格 15 mm，20 组，
# 单目 RMS 0.316/0.297 px，双目 RMS 0.334 px，校正后行差 0.14 px。
# 帧布局：[0,160) 填充 + [160,1440) 左目 + [1440,2720) 右目，裁完每目 1280x960。
# 下面的内参是 stereoRectify(alpha=0) 之后的 P1，**采集端必须先按标定给出的
# R1/R2/P1/P2 做 rectify**，直接喂未校正图像这组数不成立。
# 原始未校正内参：K1 = [649.263, 646.798, 649.529, 456.446]
#                  D1 = [0.00816, 0.09379, -0.00267, -0.00016, -0.09247]
# 基线 63.175 mm，右目相对左目旋转 0.93°。模组 ISP 已做畸变校正，残余畸变 <0.5 px。
Camera.type: "Rectified"

# Rectified Camera calibration (OpenCV)
Camera1.fx: 694.006880918
Camera1.fy: 694.006880918
Camera1.cx: 649.014984131
Camera1.cy: 444.565422058

Stereo.b: 0.063175

# Camera resolution
Camera.width: 1280
Camera.height: 960

# Camera frames per second 
Camera.fps: 30
# Optional disk-backed image black box; state data recording is independent.
# Bounded rolling image input; full --record stays off in the service.
Recording.rolling_seconds: 10.0
# Retain only the recent continuous ring, without sparse overview frames.
Recording.overview_seconds: 0.0
Recording.overview_period_seconds: 5.0
# Preserve a VIBA2-complete map through transient visual loss.
Tracking.preserve_mature_map: 1
Tracking.map_recovery_seconds: 10.0

# Color order of the images (0: BGR, 1: RGB. It is ignored if images are grayscale)
Camera.RGB: 0

# Close/Far threshold. Baseline times.
Stereo.ThDepth: 40.0

# DECXIN Camera rectified optical frame -> PX4 body FRD.
# Rotation and software time offset independently cross-validated on two motion datasets.
# Translation is USER MEASURED: forward 150 / right 20.5 / down 49.5 mm.
# Active capture: YUYV 2720x960 @30, one V4L2 buffer, post-read host timestamp.
# Camera/body transform retained; temporal calibration revalidated 2026-11-13.
# Camera-to-body includes R1 rectification. PX4 raw IMU is already body FRD.
IMU.T_b_c1: !!opencv-matrix
   rows: 4
   cols: 4
   dt: f
   data: [ -0.040888939, -0.010950522, 0.999103689, 0.150000000, 0.999145264, 0.005625817, 0.040952302, 0.020500000, -0.006069223, 0.999924215, 0.010711129, 0.049500000, 0.000000000, 0.000000000, 0.000000000, 1.000000000 ]

# Do not insert KFs when recently lost
IMU.InsertKFsWhenLost: 0

# Keep the initial acceleration-excitation check enabled.
IMU.fastInit: 0
# Cumulative mTinit thresholds in seconds (not wall-clock time or durations).
# Require 0 < VIBA1Time < VIBA2Time; applies to both maps, including after reset.
IMU.VIBA1Time: 3.0
IMU.VIBA2Time: 10.0

# IMU noise (Use those from VINS-mono)
IMU.NoiseGyro: 1e-3 # 2.44e-4 #1e-3 # rad/s^0.5
IMU.NoiseAcc: 1e-2 # 1.47e-3 #1e-2 # m/s^1.5
IMU.GyroWalk: 1e-6 # rad/s^1.5
IMU.AccWalk: 1e-4 # m/s^2.5
IMU.Frequency: 100.0 # measured DDS SensorCombined delivery

#--------------------------------------------------------------------------------------------
# ORB Parameters
#--------------------------------------------------------------------------------------------
# ORB Extractor: Number of features per image
ORBextractor.nFeatures: 1000

# ORB Extractor: Scale factor between levels in the scale pyramid 	
ORBextractor.scaleFactor: 1.2

# ORB Extractor: Number of levels in the scale pyramid	
ORBextractor.nLevels: 8

# ORB Extractor: Fast threshold
# Image is divided in a grid. At each cell FAST are extracted imposing a minimum response.
# Firstly we impose iniThFAST. If no corners are detected we impose a lower value minThFAST
# You can lower these values if your images have low contrast			
ORBextractor.iniThFAST: 20
ORBextractor.minThFAST: 7

#--------------------------------------------------------------------------------------------
# Viewer Parameters
#--------------------------------------------------------------------------------------------
Viewer.KeyFrameSize: 0.05
Viewer.KeyFrameLineWidth: 1.0
Viewer.GraphLineWidth: 0.9
Viewer.PointSize: 2.0
Viewer.CameraSize: 0.08
Viewer.CameraLineWidth: 3.0
Viewer.ViewpointX: 0.0
Viewer.ViewpointY: -0.7
Viewer.ViewpointZ: -3.5
Viewer.ViewpointF: 500.0

# Local VIO profile: no loop/GBA or inter-map merge during control.
loopClosing: 0

# Optional processing profile; acquisition and calibrated sensor timestamps remain unchanged.
Camera.newWidth: 960
Camera.newHeight: 720
