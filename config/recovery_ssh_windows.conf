# Run on Linux AFTER connecting from Windows with SSH X11 forwarding.
# Keep ssh's DISPLAY/XAUTHORITY. No Windows IP, xhost +, or open X11 port needed.
# MobaXterm: Session > SSH > Advanced SSH settings > X11-Forwarding.
DISPLAY_MODE=ssh-x11
TERMINAL_CONTROL=on
# Mesa software rendering for forwarded X11 (Pangolin uses X11/EGL here).
SOFTWARE_RENDERING=1
