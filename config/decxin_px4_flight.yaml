%YAML:1.0
# DECXIN Camera + calibrated PX4 body-FRD IMU. First airborne adoption only.
---
extrinsics_valid: 1
R_BI: !!opencv-matrix
  rows: 3
  cols: 3
  dt: d
  data: [1,0,0,0,1,0,0,0,1]
# Output is already at PX4 IMU centre: EKF2_EV_POS_X/Y/Z must be zero.
# Camera lever arm is applied once by ORB IMU.T_b_c1.
# Initial tuning values, not estimated SLAM covariances.
position_std_m: 0.1
velocity_std_m_s: 0.2
orientation_std_rad: 0.05
stable_seconds: 1.0
# New observations must be <=250ms old at evaluation. Duplicate polling does
# not restart stability until max_sample_gap_seconds without a valid new input.
max_age_seconds: 0.25
# Airborne re-creation is rejected; initial activation has its own guarded option.
allow_airborne_reference: 0
# First reference only, in ALTCTL/STAB/MANUAL, after all quality gates pass.
# Requires fresh finite time-matched PX4 xyz/heading; xy_valid need not be true.
# Finite xyz are kept even when invalid (including nonzero prior EKF XY).
# This preserves numeric frame continuity, NOT a valid absolute/takeoff position.
# First EV adoption can reset EKF; confirm valid stable fusion before POSCTL.
allow_airborne_initial_reference: 1
consistency_window_seconds: 1.0
max_window_residual_m: 0.8
# Align once on ground, or at the guarded first airborne activation above.
align_to_px4_ned: 1
max_speed_m_s: 5.0
max_attitude_rate_deg_s: 180.0
max_attitude_step_deg: 10.0
max_position_residual_m: 0.5
# Never bridge an airborne observation outage longer than 250 ms.
max_sample_gap_seconds: 0.25
# Recorded maxima: RTT 23.794ms; absolute offset residual 6.378ms.
max_sync_rtt_seconds: 0.05
max_sync_residual_seconds: 0.01
max_sync_age_seconds: 2.0
# Only motion faults may recover at a fresh, stationary, fully landed stop.
# Keep the existing reference/global transform; clock/map faults still require disarm.
allow_armed_landed_recovery: 1
landed_stable_seconds: 2.0
landed_max_speed_m_s: 0.2
domain_id: 0
topic_prefix: ""
log_path: "px4_telemetry.csv"
