%YAML:1.0

# Harrier 原场地双目惯性仿真基线。
# 相机 960x720@30 Hz，HFOV 1.590 rad，50 mm 基线；IMU 250 Hz。
# 左目在 base_link FLU 中为 (0.0485, 0.025, -0.0057) m，光轴向前。
# IMU.T_b_c1 为左目光学系到 IMU FLU 的变换；Px4Bridge 再转为 FRD。
# 参数按 Gazebo 几何和噪声设置，不是 D435i 实测标定。
# 两个无界/未成熟地图实验开关均关闭；viba2_recovery_seconds=20 为
# 独立的有界初始化地图保留策略，不降低 VIBA2 或 Gate 发布要求。
# VIBA1/2Time 是运动门控累计阈值，不是墙钟恢复时间。
# 模型来源：RM27_drone_sim/rm27_sim/models/x500_mono_cam/model.sdf。

File.version: "1.0"

Camera.type: "Rectified"

Camera1.fx: 470.87
Camera1.fy: 470.87
Camera1.cx: 480.0
Camera1.cy: 360.0

Stereo.b: 0.050

Camera.width: 960
Camera.height: 720
Camera.fps: 30

Camera.RGB: 1

Stereo.ThDepth: 40.0

IMU.T_b_c1: !!opencv-matrix
   rows: 4
   cols: 4
   dt: f
   data: [ 0.0,  0.0,  1.0,  0.0485,
          -1.0,  0.0,  0.0,  0.025,
           0.0, -1.0,  0.0, -0.0057,
           0.0,  0.0,  0.0,  1.0]

IMU.InsertKFsWhenLost: 0
IMU.fastInit: 0
IMU.VIBA1Time: 3.0
IMU.VIBA2Time: 10.0

IMU.NoiseGyro: 5.5e-5
IMU.NoiseAcc: 4.0e-4
IMU.GyroWalk: 1.0e-7
IMU.AccWalk: 1.0e-6
IMU.Frequency: 250.0

ORBextractor.nFeatures: 1000
ORBextractor.scaleFactor: 1.2
ORBextractor.nLevels: 8
ORBextractor.iniThFAST: 20
ORBextractor.minThFAST: 7

loopClosing: 0
Tracking.preserve_mature_map: 1
Tracking.map_recovery_seconds: 10.0
Tracking.retain_without_ba2: 0
Tracking.never_reset_map: 0
Tracking.viba2_recovery_seconds: 20.0

Viewer.KeyFrameSize: 0.05
Viewer.KeyFrameLineWidth: 1.0
Viewer.GraphLineWidth: 0.9
Viewer.PointSize: 2.0
Viewer.CameraSize: 0.08
Viewer.CameraLineWidth: 3.0
Viewer.ViewpointX: 0.0
Viewer.ViewpointY: -0.7
Viewer.ViewpointZ: -3.5
Viewer.ViewpointF: 500.0
